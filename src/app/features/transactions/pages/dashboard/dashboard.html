<header class="mb-6 flex flex-wrap items-end justify-between gap-3">
  <div>
    <p class="text-sm font-medium text-slate-600">{{ todayDate() | date: 'EEEE, MMMM d' }}</p>
    <h1 class="mt-0.5 text-3xl font-semibold tracking-tight text-slate-900">Budget</h1>
  </div>
  <button type="button" class="btn btn-primary hidden md:inline-flex" (click)="addOpen.set(true)">
    <svg
      aria-hidden="true"
      viewBox="0 0 24 24"
      class="size-5"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
    >
      <path d="M12 5v14M5 12h14" />
    </svg>
    New transaction
  </button>
</header>

<div class="grid items-start gap-6 lg:grid-cols-[minmax(0,24rem)_1fr]">
  <div class="lg:sticky lg:top-8">
    <app-daily-balance
      [available]="transactions.availableToday()"
      [dailyLimit]="transactions.dailyLimit()"
      [budget]="transactions.todayBudget()"
      [expenses]="transactions.todayExpenses()"
      [income]="transactions.todayIncome()"
      [usagePercent]="transactions.usagePercent()"
      [status]="transactions.budgetStatus()"
      (editLimit)="limitOpen.set(true)"
    />
  </div>

  <app-transaction-history
    [transactions]="transactions.transactions()"
    [today]="clock.today()"
    (remove)="remove($event)"
  />
</div>

<!-- Mobile primary action, above the floating nav -->
<button
  type="button"
  (click)="addOpen.set(true)"
  aria-label="New transaction"
  class="fixed bottom-[calc(5.5rem+env(safe-area-inset-bottom))] right-4 z-20 grid size-14 place-items-center rounded-full bg-linear-to-br from-brand-500 to-violet-700 text-white shadow-xl shadow-brand-700/40 transition hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600 active:scale-95 md:hidden"
>
  <svg
    aria-hidden="true"
    viewBox="0 0 24 24"
    class="size-7"
    fill="none"
    stroke="currentColor"
    stroke-width="2.5"
    stroke-linecap="round"
  >
    <path d="M12 5v14M5 12h14" />
  </svg>
</button>

<app-sheet heading="New transaction" [(open)]="addOpen">
  <app-transaction-form (submitted)="add($event)" />
</app-sheet>

<app-sheet heading="Daily limit" [(open)]="limitOpen">
  <app-daily-limit-form
    [dailyLimit]="transactions.dailyLimit()"
    (limitChange)="saveLimit($event)"
  />
</app-sheet>
